<!doctype html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guide — 官方文档</title>
    <meta name="description" content="Guide 自托管网站与服务导航的官方文档：安装部署、网站管理、在线检测、安全、升级与备份。" />
    <!--page-meta-->
    <script>
      // Before first paint: a class change after hydration produces a white flash
      // on every navigation for dark-theme readers.
      try {
        var t = localStorage.getItem("theme")
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
